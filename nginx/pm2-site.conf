# Example nginx site config for PM2 standalone Next.js on port 3007.
# Copy/adapt into /etc/nginx/sites-available/ and enable.

upstream glory_next {
  server 127.0.0.1:3007;
  keepalive 32;
}

server {
  listen 80;
  server_name www.gloryinvisiblegrills.com gloryinvisiblegrills.com;

  client_max_body_size 10m;

  location /_next/static/ {
    proxy_pass http://glory_next;
    proxy_http_version 1.1;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /images/ {
    proxy_pass http://glory_next;
    proxy_http_version 1.1;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    proxy_pass http://glory_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
