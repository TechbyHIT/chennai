# Production nginx site — PM2 standalone Next.js on 127.0.0.1:3007
# Enable: sudo ln -s /etc/nginx/sites-available/glory /etc/nginx/sites-enabled/
#
# Global http{} recommendations (once per server in nginx.conf):
#   http2 on;                 # nginx 1.25.1+
#   keepalive_timeout 65;
#   gzip on;
#   gzip_comp_level 5;
#   gzip_min_length 256;
#   gzip_vary on;
#   gzip_proxied any;
#   gzip_types text/plain text/css application/json application/javascript
#              text/xml application/xml application/xml+rss image/svg+xml
#              application/rss+xml font/woff2;
#   # If libnginx-mod-http-brotli is installed:
#   # brotli on; brotli_comp_level 5; brotli_types <same as gzip_types>;

upstream glory_next {
  server 127.0.0.1:3007;
  keepalive 32;
}

# HTTP → HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name gloryinvisiblegrills.in www.gloryinvisiblegrills.in;
  return 301 https://gloryinvisiblegrills.in$request_uri;
}

server {
  # Ubuntu nginx often lacks standalone "http2 on;" — use listen flag instead.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name gloryinvisiblegrills.in www.gloryinvisiblegrills.in;

  # ssl_certificate     /etc/letsencrypt/live/gloryinvisiblegrills.in/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/gloryinvisiblegrills.in/privkey.pem;

  client_max_body_size 8m;
  keepalive_timeout 65;

  # Efficient proxy defaults for Next.js
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_buffering on;
  proxy_buffers 16 16k;
  proxy_buffer_size 16k;
  proxy_busy_buffers_size 32k;

  # Immutable hashed assets — cache at the edge, skip Origin when possible
  location /_next/static/ {
    proxy_pass http://glory_next;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location /images/ {
    proxy_pass http://glory_next;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location = /favicon.ico {
    proxy_pass http://glory_next;
    access_log off;
    log_not_found off;
  }

  # Sitemaps — short CDN/browser cache; always absolute HTTPS in payload
  location ~ ^/sitemap(.*)\.xml$ {
    proxy_pass http://glory_next;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, s-maxage=86400, stale-while-revalidate=43200";
  }

  location / {
    proxy_pass http://glory_next;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
