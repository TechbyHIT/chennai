# Production nginx site — PM2 standalone Next.js on 127.0.0.1:3009
# Enable: sudo ln -s /etc/nginx/sites-available/glory-invisible-grills /etc/nginx/sites-enabled/
#
# SSL must cover BOTH gloryinvisiblegrills.in and www.gloryinvisiblegrills.in
# or Chrome shows "Not secure" on www.

upstream glory_next {
  server 127.0.0.1:3009;
  keepalive 32;
}

# HTTP — ACME challenge, then redirect to HTTPS apex
server {
  listen 80;
  listen [::]:80;
  server_name gloryinvisiblegrills.in www.gloryinvisiblegrills.in;

  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  location / {
    return 301 https://gloryinvisiblegrills.in$request_uri;
  }
}

# HTTPS www → apex (cert must include www)
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.gloryinvisiblegrills.in;

  ssl_certificate     /etc/letsencrypt/live/gloryinvisiblegrills.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gloryinvisiblegrills.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  server_tokens off;

  return 301 https://gloryinvisiblegrills.in$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name gloryinvisiblegrills.in;

  ssl_certificate     /etc/letsencrypt/live/gloryinvisiblegrills.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gloryinvisiblegrills.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  server_tokens off;

  client_max_body_size 8m;
  keepalive_timeout 65;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_buffering on;
  proxy_buffers 16 16k;
  proxy_buffer_size 16k;
  proxy_busy_buffers_size 32k;

  location /_next/static/ {
    proxy_pass http://glory_next;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location /images/ {
    proxy_pass http://glory_next;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location = /favicon.ico {
    proxy_pass http://glory_next;
    access_log off;
    log_not_found off;
  }

  location ~ ^/sitemap(.*)\.xml/?$ {
    proxy_pass http://glory_next;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    add_header Cache-Control "public, s-maxage=86400, stale-while-revalidate=43200";
  }

  location / {
    proxy_pass http://glory_next;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
